<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>JAE Ten'Up</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 340px;
      padding: 14px;
      margin: 0;
      color: #1f2937;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px 0;
    }
    label {
      display: block;
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: #1d4ed8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
    #openOcrLink {
      display: none;
      margin-top: 10px;
      text-align: center;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: #15803d;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
    <img src="icons/logo.svg" alt="JAE Identités" width="32" height="32">
    <h1 style="margin:0;">JAE Ten'Up → JAE-OCR</h1>
  </div>
  <label for="ocrUrl">URL du service JAE-OCR</label>
  <input id="ocrUrl" type="url" value="https://jae-ocr-2500276981.europe-west1.run.app">
  <button id="extractBtn">Extraire les 2 équipes vers JAE-OCR</button>
  <div id="status">Ouvre une page de rencontre Ten'Up puis clique sur le bouton.</div>
  <a id="openOcrLink" href="https://jae-ocr-2500276981.europe-west1.run.app" target="_blank" rel="noopener noreferrer">Ouvrir la page JAE-OCR ↗</a>
  <script src="popup.js"></script>
</body>
</html>
